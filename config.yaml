# =============================================================================
# s2-clade-mask configuration
#
# All run parameters for scripts/generate_usher_masked_sites.py live here. Run
# the generator from the repo root so the relative paths below resolve:
#
#   python scripts/generate_usher_masked_sites.py --config config.yaml
#
# The human-approved representative name-overrides and fallbacks are configured
# at the bottom of this file. Because this config is under version control, those
# entries are reviewed exactly like code.
# =============================================================================

# --- Inputs -----------------------------------------------------------------

# Full gisaid-and-public MAT (.pb.gz) and its metadata. Use the GISAID-named
# files: their sample names are what the spec representatives match against.
# Do NOT use a public-only tree (missing several GISAID-only representatives)
# or a filtered per-run tree (all clades must be present / annotated).
tree: /fh/fast/matsen_e/shared/viral-dasm/mat-trees/2026-04-22-gisaid-and-public/gisaidAndPublic.2026-04-22.masked.gisaidNames.pb.gz
metadata: /fh/fast/matsen_e/shared/viral-dasm/mat-trees/2026-04-22-gisaid-and-public/gisaidAndPublic.2026-04-22.gisaidNames.metadata.tsv.gz

# Vendored UCSC PANGO-lineage-keyed masking spec (input).
branch_spec: data/branchSpecificMask.yml

# --- Output -----------------------------------------------------------------

output: results/usher_masked_sites.yaml

# --- Old-scheme recovery check (optional) -----------------------------------

# Reference masking file the output must remain a superset of, within the
# site_include_range: the original hand-made scheme from jbloomlab/SARS2-mut-fitness
# (vendored below; see its provenance header). This is a fixed historical
# baseline, not the previous run's output -- always check against it, not
# results/usher_masked_sites.yaml. Leave unset to skip the check.
old_yaml: data/usher_masked_sites_old_scheme.yml

# --- Parameters -------------------------------------------------------------

clade_column: Nextstrain_clade

# Masks outside [start, end] (the 5'/3' UTRs) are dropped -- the mat-pcp range
# filter discards those positions at runtime regardless.
site_include_start: 266
site_include_end: 29674

strict: true       # fail (nonzero exit) if old masks are not fully recovered
union_old: false   # force-include any unrecovered old masks instead of failing

# --- Execution --------------------------------------------------------------

matutils: matUtils   # binary name / path (from the `usher` conda package)
workdir: results     # dir for the large temporary matUtils paths files

# Precomputed matUtils outputs (optional; skip the matUtils extract passes).
# Under Snakemake, pointing these at existing files satisfies the extract rules'
# inputs so they never fire -- the fast dev path (reuse the ~19 GB sample_paths):
# sample_paths: results/sample_paths.tsv
# clade_paths: results/clade_paths.tsv

# Staged-pipeline intermediates / diagnostic reports (optional; these are the
# defaults -- the Snakemake rules write them and compare_and_build/check_recovery
# read them). All are gitignored and regenerated each run.
# nodes_representative: results/nodes_representative.yaml   # Mode 1 node map
# nodes_founder: results/nodes_founder.yaml                 # Mode 2 node map
# comparison_report: results/anchoring_comparison.txt       # rep-vs-founder diff
# recovery_report: results/recovery_report.txt              # old-scheme recovery

# log: results/generate.log   # optional run log file

# --- Human-approved resolution deviations -----------------------------------
#
# Representatives are matched to the tree by EXACT equality on the sample name
# before the first '|' -- never a fuzzy/substring match. The two tables below are
# the ONLY sanctioned deviations; an unresolvable representative with no entry
# here is a hard error. Add an entry only after confirming the sample by hand in
# the tree, and note the clade + reason. Revisit whenever the spec or tree changes.

# Spec representative name -> exact tree sample name (field before '|').
# These differ from the spec only by country abbreviation in the 2026-04-22 tree.
representative_name_overrides:
  IND/GBRC714b/2021: India/GJ-GBRC714b/2021                 # clade B.1.617.2
  BGD/icddrb_TND_06_1053/2022: Bangladesh/icddrb_TND_06_1053/2022  # clade XBB

# PANGO clade -> approved fallback when its representative is absent from the tree.
#   via: founder                      -> use the clade's annotated MRCA node
#   via: sample, name: ..., backtrack: n -> resolve an approved alternate sample
representative_fallbacks:
  # FRA/IHUCOVID-005193-N1/2021 is not in the 2026-04-22 gisaid-and-public MAT.
  # P.1's only mask is the deletion [11288, 11296], also masked via B.1.1.7 and
  # B.1.351; the annotated 20J (Gamma) founder anchors it faithfully.
  P.1:
    via: founder
